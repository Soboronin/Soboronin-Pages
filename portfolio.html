<style>
  header { margin-bottom: 28px; }

  /* --- カテゴリフィルター(複数選択可) --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  .filters button {
    font-family: inherit;
    padding: 8px 16px;
    border: 2.5px solid var(--card-border);
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .filters button.active {
    background: var(--ink);
    color: var(--bg);
  }

  /* --- ギャラリー --- */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .art-card {
    display: block;
    width: 100%;
    padding: 0;
    font: inherit;
    text-align: left;
    border: 2.5px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    box-shadow: 3px 3px 0 var(--card-border);
    cursor: pointer;
    transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.12s ease;
  }

  .art-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--card-border);
  }

  .art-card:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  /* フィルターで除外される作品: 非表示にする前に、縮小+フェードで
     一瞬アニメーションさせてから消すことで、残った作品が
     ガクッと詰まって見える「パカパカ」感を和らげる */
  .art-card.filter-hidden {
    display: none;
  }

  .art-card.filter-leaving {
    opacity: 0;
    transform: scale(0.85);
  }

  .art-card.filter-entering {
    opacity: 0;
    transform: scale(0.85);
  }

  .art-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background-size: cover;
    background-position: center;
    border-bottom: 2.5px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 画像未設定のプレースホルダー用 */
  .art-thumb.placeholder {
    background: repeating-linear-gradient(
      135deg,
      #fff,
      #fff 10px,
      #f1ebdd 10px,
      #f1ebdd 20px
    );
  }

  .art-thumb.placeholder .material-symbols-outlined {
    font-size: 30px;
    color: var(--ink-dim);
    opacity: 0.6;
  }

  /* 動画カードの再生アイコンバッジ */
  .play-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .play-badge .material-symbols-outlined {
    font-size: 16px;
    color: var(--bg);
  }

  /* 絵柄タグ(#厚塗り など)。サムネイルの左上に重ねて表示する */
  .style-tags {
    position: absolute;
    top: 6px;
    left: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-width: calc(100% - 12px);
  }

  .style-tags span {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(32, 28, 22, 0.72);
    color: #fff;
    backdrop-filter: blur(2px);
  }

  .art-caption {
    display: block;
    padding: 9px 12px 10px;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.4;
  }

  /* --- ライトボックス --- */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32, 28, 22, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .lightbox.open { display: flex; }

  .lightbox-inner {
    max-width: 560px;
    width: 100%;
  }

  .lightbox-img {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 12px;
    border: 2.5px solid var(--bg);
    background: #fff;
  }

  .lightbox-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    border: 2.5px solid var(--bg);
    background: #000;
  }

  .lightbox-cap {
    color: var(--bg);
    font-size: 13px;
    font-weight: 700;
    margin: 14px 0 0;
    text-align: center;
  }

  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--bg);
    border: 2.5px solid var(--bg);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: var(--ink);

  }

  footer {

    font-size: 11.5px;
  }

<script>
  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxVideo = document.getElementById('lightboxVideo');
  const lightboxCap = document.getElementById('lightboxCap');
  const filters = document.getElementById('filters');
  const lightboxClose = document.getElementById('lightboxClose');
  let lastFocus = null; // ライトボックスを閉じたときに、開いた作品カードへフォーカスを戻す

  // ライトボックスが開いている間は、背景(本文・マスコット)にキーボードで入れないようにする
  function setBackgroundInert(on) {
    [document.querySelector('main'), document.getElementById('mascot')].forEach(el => { if (el) el.inert = on; });
  }

  // YouTubeの共有URLをコピペすると "動画ID?si=xxxx" のような形で
  // ゴミが付いてくることがあるので、"?" 以降を切り落として素のIDだけにする
  function cleanVideoId(raw) {
    return (raw || '').split('?')[0].trim();
  }

  // 動画カードは、サムネイル画像を用意しなくてもYouTubeの自動サムネイルを使う
  gallery.querySelectorAll('.art-card[data-type="video"]').forEach(card => {
    const id = cleanVideoId(card.dataset.video);
    if (!id) return; // 動画IDが未設定のカードはプレースホルダーのまま
    const thumb = card.querySelector('.art-thumb');
    thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${id}/maxresdefault.jpg')`;
    thumb.classList.remove('placeholder');
    // maxresdefault が存在しない動画は120x90のダミー画像が返ってくる(エラーにはならない)ので、
    // 画像サイズを見て判定し、無ければ標準画質にフォールバックする
    const probe = new Image();
    probe.onload = function () {
      if (probe.naturalWidth <= 120) {
        thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${id}/hqdefault.jpg')`;
      }
    };
    probe.src = `https://img.youtube.com/vi/${id}/maxresdefault.jpg`;
    // プレースホルダー用の大きいアイコン(movie/campaignなど)は不要になるので隠す
    // (再生ボタンのバッジ .play-badge はそのまま残す)
    const bigIcon = thumb.querySelector(':scope > .material-symbols-outlined');
    if (bigIcon) bigIcon.style.display = 'none';
  });

  const activeFilters = new Set();

  function hideNow(card) {
    card.classList.add('filter-hidden');
    card.classList.remove('filter-leaving', 'filter-entering');
  }

  // 表示/非表示は、選択中のフィルター(activeFilters)から毎回計算し直す。
  // 「フェードアウト後に隠す」予約はタイマーで管理し、すぐ解除された場合は取り消す
  // (以前は transitionend 頼みで、押してすぐ解除するとカードが消えたままになっていた)
  function applyFilters() {
    gallery.querySelectorAll('.art-card').forEach(card => {
      const cats = (card.dataset.category || '').split(' ');
      const show = activeFilters.size === 0 || cats.some(c => activeFilters.has(c));
      const isHidden = card.classList.contains('filter-hidden');

      if (show) {
        clearTimeout(card._hideTimer); // 隠す予約が残っていたら取り消す
        card.classList.remove('filter-leaving');
        if (isHidden) {
          // 非表示 → 表示: display を戻してから、次のフレームでフェードイン
          card.classList.remove('filter-hidden');
          card.classList.add('filter-entering');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => card.classList.remove('filter-entering'));
          });
        }
      } else if (!isHidden && !card.classList.contains('filter-leaving')) {
        // 表示 → 非表示: 先にフェードアウトさせてから display:none にする
        card.classList.add('filter-leaving');
        card._hideTimer = setTimeout(() => hideNow(card), 200);
      }
    });
  }

  filters.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const f = btn.dataset.filter;
    if (activeFilters.has(f)) {
      activeFilters.delete(f);
      btn.classList.remove('active');
    } else {
      activeFilters.add(f);
      btn.classList.add('active');
    }
    btn.setAttribute('aria-pressed', activeFilters.has(f) ? 'true' : 'false');
    applyFilters();
  });

  gallery.addEventListener('click', function (e) {
    const card = e.target.closest('.art-card');
    if (!card || card.classList.contains('filter-hidden')) return;
    e.preventDefault();

    // プレースホルダーのカードはライトボックスを開かない
    if (card.querySelector('.art-thumb.placeholder')) return;

    lightboxCap.textContent = card.dataset.title || '';

    if (card.dataset.type === 'video') {
      const videoId = cleanVideoId(card.dataset.video);
      lightboxImg.style.display = 'none';
      lightboxVideo.style.display = 'block';
      lightboxVideo.src = 'https://www.youtube-nocookie.com/embed/' + videoId + '?autoplay=1';
    } else {
      const thumb = card.querySelector('.art-thumb');
      const bg = thumb.style.backgroundImage;
      const url = bg.slice(5, -2); // url("...") から中身を取り出す
      lightboxVideo.style.display = 'none';
      lightboxVideo.src = '';
      lightboxImg.style.display = 'block';
      lightboxImg.src = url;
      lightboxImg.alt = card.dataset.title || '';
    }

    lightbox.classList.add('open');
    lastFocus = card;
    setBackgroundInert(true);
    lightboxClose.focus();
  });

  function closeLightbox() {
    if (!lightbox.classList.contains('open')) return;
    lightbox.classList.remove('open');
    setBackgroundInert(false);
    if (lastFocus) lastFocus.focus();
    lightboxImg.src = '';
    lightboxVideo.src = ''; // 埋め込み動画を停止
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLightbox();
  });
</script>
