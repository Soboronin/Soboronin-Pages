<!-- GitHub Pages は、存在しないURLを開かれると、このファイルを表示します。
     どんな深さのURL(例: /Soboronin-Pages/a/b/c)で表示されても CSS・画像・リンクが読めるように、
     <base> でサイトの場所を指定しています。リポジトリ名を変えたときは、ここも変更してください。 -->
<base href="/Soboronin-Pages/">
<script>
  // 手元での確認用: 公開先(/Soboronin-Pages/ の下)以外で開いたときは、<base> を切り替える
  //   ・ファイルを直接開いた(file://)  → このファイルと同じフォルダ
  //   ・ローカルサーバーで開いた        → サーバーのいちばん上(/)
  (function () {
    var base = document.querySelector('base');
    if (location.protocol === 'file:') {
      base.href = location.href.replace(/[^/]*$/, '');
    } else if (location.pathname.indexOf('/Soboronin-Pages/') !== 0) {
      base.href = location.origin + '/';
    }
  })();
</script>

<!-- フォントのCSSは、ページの表示を止めないように、あとから読み込みます(届くまでは代わりのフォントで表示されます)。
     アイコンは、フォントが届くまで隠しておきます(読み込み前は「close」などの文字名が見えてしまうため)。
     新しいアイコンを使うときは、icon_names にその名前を追加してください
     (アルファベット順・全ページ共通の同じURLにすると、ブラウザのキャッシュが効きます) -->
<script>
  (function () {
    document.documentElement.classList.add('js');
    if (document.fonts && document.fonts.addEventListener) {
      document.fonts.addEventListener('loadingdone', function (e) {
        for (var i = 0; i < e.fontfaces.length; i++) {
          if (String(e.fontfaces[i].family).indexOf('Material Symbols') >= 0) {
            document.documentElement.classList.add('icons-ready');
            break;
          }
        }
      });
    }
  })();
</script>
