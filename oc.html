<meta charset="UTF-8">

<!-- アイコンは使うものだけを読み込んでいます。新しいアイコンを使うときは、
     icon_names にその名前を追加してください(アルファベット順・全ページ共通の同じURLにすると、ブラウザのキャッシュが効きます) -->

<link rel="stylesheet" href="common.css" />
<link rel="stylesheet" href="mascot.css" />
<style>
  header { margin-bottom: 28px; }

  /* --- 世界観フィルター(単一選択) --- */
  .world-filters {
    display: flex;
    gap: 8px;
    margin: 22px 0;
  }

  .world-filters button {
    font-family: inherit;
    flex: 1;
    padding: 9px 14px;
    border: 2.5px solid var(--card-border);
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .world-filters button.active {
    background: var(--ink);
    color: var(--bg);
  }

  /* --- キャスト一覧(タップでそのキャラまでジャンプ) --- */
  .cast-index {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 14px 6px;
    margin-bottom: 28px;
  }

  .cast-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    min-width: 0;
    text-decoration: none;
    color: var(--ink);
    cursor: pointer;
  }

  .cast-thumb {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background-size: cover;
    background-position: top center;
    background-color: #fff;
  }

  .cast-thumb.placeholder {
    background-color: #f1ebdd;
    background-image: repeating-linear-gradient(135deg, #fff, #fff 6px, #f1ebdd 6px, #f1ebdd 12px) !important;
    border-style: dashed;
  }

  .cast-name {
    font-size: 10.5px;
    font-weight: 700;
    text-align: center;
    line-height: 1.25;
  }

  /* 所属フィルターで外れているキャラ: 薄くして、タップも効かなくする */
  .cast-item { transition: opacity 0.18s ease; }
  .cast-item.cast-dim { opacity: 0.3; pointer-events: none; }

  .cast-item:focus-visible,
  .oc-portrait:focus-visible,
  .true-name:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* --- 所属フィルター(とどのつまり限定・複数選択可) --- */
  .affil-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 22px;
  }

  .affil-filters button {
    font-family: inherit;
    flex: 1 1 0;
    padding: 6px 8px;
    border: 2px solid var(--card-border);
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .affil-filters button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .oc-card {
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .oc-card.affil-hidden {
    display: none;
  }

  .oc-card.affil-leaving {
    opacity: 0;
    transform: scale(0.97);
  }

  .oc-card.affil-entering {
    opacity: 0;
    transform: scale(0.97);
  }

  /* --- 所属アイコン --- */
  .affil-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    flex: 0 0 auto;
    margin-right: 4px;
    background-color: var(--ink);
    border: 1.5px solid var(--ink);
  }

  .affil-icon:not(.placeholder) {
    background-size: 65%;
    background-repeat: no-repeat;
    background-position: center;
  }

  .affil-icon.placeholder {
    border: 1.5px dashed var(--card-border);
    background-color: #fff;
  }

  .affil-icon[data-affil="none"] {
    display: none;
  }

  /* --- キャラクター選択リスト(上部) --- */
  .char-select {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 34px;
  }

  .char-select a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 8px;
    background: #fff;
    border: 2.5px solid var(--card-border);
    border-radius: 999px;
    text-decoration: none;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
  }

  .char-select .thumb {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--card-border);
    object-fit: cover;
    background: var(--yellow);
  }

  /* --- キャラクター詳細カード --- */
  .oc-list {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* 各カード下の「↑ 一覧へ」 */
  #worldFilters { scroll-margin-top: 16px; }

  .oc-foot {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin-top: 8px;
  }

  .oc-foot-btn {
    padding: 7px 10px;
    border: none;
    border-radius: 8px;
    background: none;
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink-dim);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  .oc-foot-btn:hover { color: var(--ink); }

  .oc-foot-btn:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 1px;
  }

  /* oc-data.js に書き間違いがあるときだけ出る注意書き */
  .oc-notice {
    padding: 12px 16px;
    border: 2px dashed var(--card-border);
    border-radius: 12px;
    background: #fff;
    font-size: 12px;
    line-height: 1.7;
  }
  .oc-notice strong { display: block; margin-bottom: 4px; }
  .oc-notice ul { margin: 0; padding-left: 1.3em; }

  .oc-card {
    position: relative;
    background: #fff;
    border: 2.5px solid var(--card-border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 4px 4px 0 var(--card-border);
    scroll-margin-top: 20px;
  }

  /* UTAU配布ページへのブックマーク風リンク */
  .utau-badge {
    position: absolute;
    top: -3px;
    right: 24px;
    width: 32px;
    height: 42px;
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
    line-height: 1;
    text-decoration: none;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%);
    z-index: 2;
    transition: transform 0.12s ease;
  }

  .utau-badge .material-symbols-outlined {
    font-size: 17px;
  }

  .utau-badge:hover { transform: translateY(2px); }

  .utau-badge:focus-visible {
    outline: 2px solid var(--card-border);
    outline-offset: 2px;
  }

  .oc-head {
    margin-bottom: 16px;
  }

  .oc-portrait-wrap {
    width: 100%;
    margin-bottom: 10px;
  }

  /* バッジや煙は、衣装ボタン欄を含まない「画像そのものの範囲」を基準に置きたいので
     ここに position:relative を持たせる(costume-select の高さ変化の影響を受けないように) */
  .oc-portrait-stage {
    position: relative;
  }

  .oc-portrait {
    width: 100%;
    aspect-ratio: 4 / 5;
    max-height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    cursor: pointer;
    overflow: hidden;
  }

  .oc-portrait img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .oc-portrait.single { cursor: default; }

  .portrait-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: var(--ink);
    color: var(--bg);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .oc-portrait.placeholder {
    border-radius: 10px;
    border: 2px dashed var(--card-border);
    background-color: #f1ebdd;
    background-image: repeating-linear-gradient(135deg, #fff, #fff 8px, #f1ebdd 8px, #f1ebdd 16px) !important;
  }

  /* 変化(人間/人外)切り替え時の煙エフェクト:
     左右から煙画像が中央へ寄ってきて、キャラの姿を隠している間に裏で画像を差し替える */
  .poof {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .poof-cloud {
    position: absolute;
    top: 0;
    width: 75%;
    height: 100%;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0;
  }

  .poof-cloud.left {
    left: 0;
    background-image: url('img/oc/effects/smoke_left.png');
    background-position: left center;
    transform: translateX(-55%);
  }

  .poof-cloud.right {
    right: 0;
    background-image: url('img/oc/effects/smoke_right.png');
    background-position: right center;
    transform: translateX(55%);
  }

  .poof.active .poof-cloud {
    animation: poof-sweep 0.6s ease-in-out forwards;
  }

  .poof.active .poof-cloud.right {
    animation-name: poof-sweep-right;
  }

  @keyframes poof-sweep {
    0% { transform: translateX(-55%); opacity: 0; }
    35% { opacity: 1; }
    55% { transform: translateX(0%); opacity: 1; }
    100% { transform: translateX(20%); opacity: 0; }
  }

  @keyframes poof-sweep-right {
    0% { transform: translateX(55%); opacity: 0; }
    35% { opacity: 1; }
    55% { transform: translateX(0%); opacity: 1; }
    100% { transform: translateX(-20%); opacity: 0; }
  }

  /* 立ち絵そのものを白でいったん完全に覆い隠してから、新しい姿をフェードで見せる。
     煙エフェクト(poof-cloud)が微妙な場合は、下の2つの .poof-cloud の行だけ
     HTML側から削除すればこの白フェードだけが残ります */
  .poof-flash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
  }

  .poof.active .poof-flash {
    animation: poof-flash 0.6s ease-in-out forwards;
  }

  @keyframes poof-flash {
    0% { opacity: 0; }
    40% { opacity: 1; }
    60% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* 衣装違い選択(通常/変化の切り替えとは別) */
  .costume-select {
    display: none;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: flex-start;
    align-content: flex-start;
    gap: 6px;
    margin-top: 8px;
    width: 100%;
  }

  .costume-select button {
    font-family: inherit;
    padding: 6px 11px;
    border: 1.5px solid var(--card-border);
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    box-sizing: border-box;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  .costume-select button.active {
    background: var(--ink);
    color: var(--bg);
  }

  .costume-select button:disabled {
    cursor: default;
    opacity: 0.7;
  }

  .oc-info { min-width: 0; }

  .oc-name {
    font-size: 19px;
    font-weight: 900;
    margin: 0 0 2px;
  }

  .true-name {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 6px 0;
    margin: -6px 0 6px; /* 押せる範囲を広げつつ、見た目の位置は変えない */
  }

  .true-name .value {
    font-weight: 700;
    filter: blur(5px);
    transition: filter 0.15s ease;
    user-select: none;
  }

  .true-name.revealed .value {
    filter: none;
    user-select: text;
  }

  .true-name-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 15px;
    height: 15px;
    flex: 0 0 auto;
  }

  .true-name .material-symbols-outlined {
    font-size: 14px;
    line-height: 1;
  }

  /* ルビ(真名・通常の名前どちらにも適用、小さめ) */
  .oc-info ruby rt {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--ink-dim);
    letter-spacing: 0;
  }

  /* --- ボイスサンプル再生(カード下部・控えめ、複数可) --- */
  .voice-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
  }

  .voice-play {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px 0 0;
    border-radius: 999px;
    border: 1.5px solid var(--card-border);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
  }

  .voice-play .icon-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .voice-play .material-symbols-outlined {
    font-size: 16px;
  }

  .voice-play-label {
    padding-right: 2px;
  }

  /* ラベルが無いボタン(1個しか無い時など)はアイコンだけの丸ボタンにする */
  .voice-play:not(:has(.voice-play-label)) {
    padding: 0;
  }

  .voice-play[disabled] {
    opacity: 0.3;
    cursor: default;
  }

  .voice-play.playing {
    animation: voice-pulse 0.9s ease-in-out infinite;
  }

  @keyframes voice-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(32, 28, 22, 0.25); }
    50% { box-shadow: 0 0 0 5px rgba(32, 28, 22, 0); }
  }

  dl.oc-facts {
    margin: 0;
    font-size: 12px;
    line-height: 1.9;
  }

  dl.oc-facts div { display: flex; gap: 6px; }
  dl.oc-facts dt { color: var(--ink-dim); flex: 0 0 56px; }
  dl.oc-facts dd { margin: 0; flex: 1; display: flex; align-items: center; flex-wrap: wrap; }

  .taggroups {
    margin: 14px 0 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .taggroup {
    /* ラベルとチップを縦積みにする(横並びだとチップの数が多い時に
       幅がうまく詰まらず崩れていたため) */
  }

  .tg-label {
    display: block;
    font-size: 10.5px;
    color: var(--ink-dim);
    font-weight: 700;
    margin-bottom: 5px;
  }

  .oc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .oc-tags span {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 6px;
    border: none;
    background: #f4efe3;
    color: var(--ink);
  }

  /* 好き/嫌い/趣味/特技がそもそも無い項目用。
     サイト内では点線=「未設定・空」の意味で使っているので(空サムネイルなど)、
     中身のあるチップ(塗り)に対して、点線の枠だけの空っぽチップにする */
  .oc-tags span.tag-none {
    padding: 2px 8px;
    border: 1px dashed #b9b2a3;
    background: transparent;
    color: var(--ink-dim);
  }

  .oc-desc {
    font-size: 12.5px;
    line-height: 1.9;
    color: var(--ink);
    margin: 16px 0 0;
    padding-top: 16px;
    border-top: 1.5px dashed var(--card-border);
  }

  .oc-desc p { margin: 0 0 8px; }
  .oc-desc p:last-child { margin-bottom: 0; }

  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--ink-dim);
    font-size: 11.5px;
  }

  /* --- 右下の追従SDイラスト(mascot.css に切り出し済み) --- */

  @media (max-width: 480px) {
    .oc-card { padding: 16px; }
    dl.oc-facts dt { flex-basis: 48px; }
    .oc-name { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <nav class="nav-tabs" aria-label="サイト内メニュー">
    <a href="index.html">ホーム</a>
    <a href="tools.html">ツール配布</a>
    <a href="portfolio.html">ポートフォリオ</a>
    <a href="oc.html" class="active" aria-current="page">OC</a>
  </nav>

  <header>
    <span class="badge">ORIGINAL CHARACTER</span>
    <h1>そぼろ忍の<br>OCまとめ</h1>
    <p class="lede">オリジナルキャラクターを紹介しています。</p>
  </header>

  <!--
    世界観・所属・キャラクターの情報は oc-data.js にまとめてあります(追加・編集はそちらだけでOK)。
    下のボタンやカードは、ページを開いたときに oc-data.js から自動で作られます。
  -->
  <div class="world-filters" id="worldFilters" role="group" aria-label="世界観"></div>

  <!-- 所属フィルター: とどのつまり(world-a)のキャラのみ対象。複数選択可(OR条件) -->
  <div class="affil-filters" id="affilFilters" role="group" aria-label="所属で絞り込み"></div>

  <!-- キャスト一覧: 各キャラの thumb(顔アイコン)から自動生成。未指定なら点線のプレースホルダー -->
  <div class="cast-index" id="castIndex"></div>

  <div class="oc-list" id="ocList">
    <noscript><p class="lede">キャラクター紹介の表示には JavaScript が必要です。</p></noscript>
  </div>

  <footer>
    <p>そぼろ忍</p>
    <p>Ust: 有魚神弥 様</p>
  </footer>
</main>

<!-- 右下の追従SDイラスト(表示中のキャラに連動。ロジックは mascot.js) -->
<div id="mascot" aria-hidden="true"><div class="mascot-inner"></div></div>

<script src="oc-data.js"></script>
<script>
  // oc-data.js の内容から、世界観ボタン・所属ボタン・キャラクターカードを作る
  // (この後ろのスクリプトは、ここで作られた要素を使って動きます)
  (function renderFromData() {
    // 書き間違いがあっても、ページ全体が空にならないようにする。
    // 見つかった問題は、コンソールと、リスト上部の注意書きに出す
    const problems = [];
    const list = document.getElementById('ocList');

    function showProblems() {
      if (!problems.length) return;
      problems.forEach(p => console.warn('[oc-data.js] ' + p));
      if (!list) return;
      const box = document.createElement('div');
      box.className = 'oc-notice';
      box.setAttribute('role', 'alert');
      box.innerHTML = '<strong>oc-data.js に確認が必要な箇所があります</strong><ul>' +
        problems.map(p => '<li>' + String(p).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</li>').join('') + '</ul>';
      list.insertBefore(box, list.firstChild);
    }

    const data = window.OC_DATA;
    if (!data || !Array.isArray(data.characters)) {
      problems.push('oc-data.js を読み込めませんでした(ファイルが無い、または書き方に間違いがあります)。ブラウザのコンソールに、間違いの場所が出ています。');
      showProblems();
      return;
    }

    const esc = s => String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    // 文字の中の {忍|にん} をルビにする(それ以外はそのまま表示されるようエスケープする)
    const ruby = s => esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
    const ICON = name => '<span class="material-symbols-outlined" aria-hidden="true">' + name + '</span>';

    const affils = data.affiliations || {};

    // --- 世界観ボタン / 所属ボタン ---
    const worldFilters = document.getElementById('worldFilters');
    if (worldFilters) {
      worldFilters.innerHTML = (data.worlds || []).map((w, i) =>
        '<button type="button" data-world="' + esc(w.id) + '"' + (i === 0 ? ' class="active"' : '') + '>' + esc(w.label) + '</button>'
      ).join('');
    }
    const affilFilters = document.getElementById('affilFilters');
    if (affilFilters) {
      affilFilters.innerHTML = Object.keys(affils).map(k =>
        '<button type="button" data-affil="' + esc(k) + '">' + esc(affils[k].label) + '</button>'
      ).join('');
    }

    // --- キャラクターカード ---
    const TAGGROUPS = [
      ['好き', 'like', 'likes'],
      ['嫌い', 'dislike', 'dislikes'],
      ['趣味', 'hobby', 'hobbies'],
      ['特技', 'skill', 'skills'],
    ];

    function factRows(c) {
      const rows = [];
      const af = c.affiliation ? affils[c.affiliation] : null;
      if (af) {
        // 所属は affiliation から自動で先頭に入れる(アイコン画像が無い所属はアイコンだけ空)
        rows.push('<div><dt>所属</dt><dd><span class="affil-icon"' +
          (af.icon ? ' style="background-image:url(\'' + esc(af.icon) + '\')"' : '') +
          ' data-affil="' + esc(c.affiliation) + '"></span>' + esc(af.label) + '</dd></div>');
      }
      (c.facts || []).forEach(f => {
        rows.push('<div><dt>' + ruby(f[0]) + '</dt><dd>' + ruby(f[1]) + '</dd></div>');
      });
      return rows.join('');
    }

    function tagGroups(c) {
      return TAGGROUPS.map(g => {
        const items = c[g[2]] || [];
        const inner = items.length
          ? items.map(t => '<span>' + ruby(t) + '</span>').join('')
          : '<span class="tag-none">特になし</span>';
        return '<div class="taggroup"><span class="tg-label">' + g[0] + '</span><div class="oc-tags ' + g[1] + '">' + inner + '</div></div>';
      }).join('');
    }

    function voiceRow(c) {
      // voices を省略したときは「準備中」の無効ボタンを1個出す。[] ならボイス欄ごと出さない
      const voices = c.voices === undefined ? [{ src: '' }] : c.voices;
      if (voices.length === 0) return '';
      return '<div class="voice-row">' + voices.map(v =>
        '<button type="button" class="voice-play" data-src="' + esc(v.src || '') + '" title="' + esc(v.title || 'ボイスサンプルを再生') + '">' +
          '<span class="icon-circle">' + ICON('play_arrow') + '</span>' +
          (v.label ? '<span class="voice-play-label">' + esc(v.label) + '</span>' : '') +
        '</button>'
      ).join('') + '</div>';
    }

    function cardHtml(c) {
      return '<div class="oc-card" id="' + esc(c.id) + '" data-world="' + esc(c.world) + '"' +
          (c.affiliation ? ' data-affiliation="' + esc(c.affiliation) + '"' : '') +
          (c.thumb ? ' data-thumb="' + esc(c.thumb) + '"' : '') +
          (c.sd && c.sd.length ? ' data-sd="' + esc(c.sd.join(',')) + '"' : '') + '>' +
        (c.utau
          ? '<a class="utau-badge" href="' + esc(c.utau) + '" target="_blank" rel="noopener noreferrer" title="UTAU配布ページへ" aria-label="UTAU配布ページへ">' + ICON('music_note') + '</a>'
          : '') +
        '<div class="oc-head">' +
          '<div class="oc-portrait-wrap">' +
            '<div class="oc-portrait-stage">' +
              '<div class="oc-portrait placeholder" data-forms="' + esc(JSON.stringify(c.forms || {})) + '"></div>' +
              '<span class="portrait-badge"></span>' +
              '<div class="poof" aria-hidden="true"><span class="poof-flash"></span><span class="poof-cloud left"></span><span class="poof-cloud right"></span></div>' +
            '</div>' +
            '<div class="costume-select"></div>' +
          '</div>' +
          '<div class="oc-info">' +
            '<h2 class="oc-name">' + ruby(c.name) + '</h2>' +
            (c.trueName
              ? '<p class="true-name"><span class="true-name-icon">' + ICON('visibility') + '</span>' + esc(c.trueNameLabel || '真名') + ': <span class="value">' + ruby(c.trueName) + '</span></p>'
              : '') +
            '<dl class="oc-facts">' + factRows(c) + '</dl>' +
            '<div class="taggroups">' + tagGroups(c) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="oc-desc">' +
          '<p>' + (c.desc || []).map(ruby).join('<br>') + '</p>' +
          voiceRow(c) +
        '</div>' +
        // キャスト一覧に戻る導線(長いページなので)
        '<div class="oc-foot">' +
          '<a class="oc-foot-btn" href="#worldFilters" data-act="to-list">↑ 一覧へ</a>' +
        '</div>' +
      '</div>';
    }

    // --- 入力チェック ---
    const KNOWN_KEYS = ['id', 'world', 'affiliation', 'thumb', 'utau', 'name', 'trueName', 'trueNameLabel',
      'forms', 'facts', 'likes', 'dislikes', 'hobbies', 'skills', 'desc', 'voices', 'sd'];
    const ARRAY_KEYS = ['facts', 'likes', 'dislikes', 'hobbies', 'skills', 'desc', 'voices', 'sd'];
    const worldIds = (data.worlds || []).map(w => w && w.id);
    const seenIds = {};

    if (!Array.isArray(data.worlds) || data.worlds.length === 0) {
      problems.push('worlds が空か、配列になっていません(世界観ボタンが出ません)');
    }

    // 戻り値: { label, fatal(このキャラを表示できない理由), warns(表示はするが直したほうがいい点) }
    function validate(c, n) {
      const v = { label: n + '番目のキャラ', fatal: '', warns: [] };
      if (!c || typeof c !== 'object' || Array.isArray(c)) {
        v.fatal = 'キャラのデータが { ... } の形になっていません';
        return v;
      }
      if (c.id) v.label = 'id「' + c.id + '」';
      if (typeof c.id !== 'string' || !/^[A-Za-z0-9_-]+$/.test(c.id)) {
        v.fatal = 'id が空、または半角英数(- _ 可)ではありません';
        return v;
      }
      if (seenIds[c.id]) {
        v.fatal = 'id が他のキャラと重複しています';
        return v;
      }
      seenIds[c.id] = true;

      if (worldIds.indexOf(c.world) < 0) v.warns.push('world「' + c.world + '」が worlds にありません(このキャラはどの世界観にも表示されません)');
      if (c.affiliation !== undefined && !(data.affiliations && data.affiliations[c.affiliation])) {
        v.warns.push('affiliation「' + c.affiliation + '」が affiliations にありません');
      }
      if (typeof c.name !== 'string' || !c.name) v.warns.push('name がありません');
      Object.keys(c).forEach(k => {
        if (KNOWN_KEYS.indexOf(k) < 0) v.warns.push('「' + k + '」という項目は使われません(書き間違いではありませんか?)');
      });
      for (const k of ARRAY_KEYS) {
        if (c[k] !== undefined && !Array.isArray(c[k])) {
          v.fatal = k + ' は [ ... ] の配列で書いてください';
          return v;
        }
      }
      (c.facts || []).forEach(f => {
        if (!Array.isArray(f) || f.length !== 2) v.warns.push('facts は [\'項目名\', \'内容\'] の形で書いてください');
      });
      if (c.forms !== undefined) {
        // 立ち絵の書き方が違うと、後ろの立ち絵の処理でエラーになるので、
        // その場合は立ち絵を「準備中」表示にして、他の部分は表示する
        let ok = !!c.forms && typeof c.forms === 'object' && !Array.isArray(c.forms);
        if (!ok) {
          v.warns.push('forms の書き方が違います(human / nonhuman を持つ { ... } にしてください)');
        } else {
          Object.keys(c.forms).forEach(fk => {
            const f = c.forms[fk];
            if (!f || typeof f.label !== 'string' || !Array.isArray(f.costumes) || !f.costumes.every(x => x && typeof x === 'object')) {
              ok = false;
              v.warns.push('forms.' + fk + ' には label と、{ src, label } を並べた costumes([ ... ])が必要です');
            }
          });
        }
        if (!ok) {
          v.badForms = true;
          v.warns.push('立ち絵は「準備中」表示にしています');
        }
      }
      return v;
    }

    const cards = [];
    data.characters.forEach((c, i) => {
      const v = validate(c, i + 1);
      v.warns.forEach(w => problems.push(v.label + ': ' + w));
      if (v.fatal) {
        problems.push(v.label + ': ' + v.fatal + '(このキャラは表示していません)');
        return;
      }
      try {
        cards.push(cardHtml(v.badForms ? Object.assign({}, c, { forms: {} }) : c));
      } catch (err) {
        problems.push(v.label + ': 表示中にエラーになりました(' + err.message + ')。このキャラは表示していません');
      }
    });

    if (list) list.insertAdjacentHTML('beforeend', cards.join(''));
    showProblems();
  })();
</script>

<script>
  // キャスト一覧を各キャラのdata-formsから自動生成
  (function buildCastIndex() {
    const indexEl = document.getElementById('castIndex');
    if (!indexEl) return;

    document.querySelectorAll('.oc-card').forEach(card => {
      // 全身絵を縮小すると顔が判別できないため、自動取得はせず
      // data-thumb で明示的に指定された画像だけをサムネイルとして使う
      const thumbSrc = card.dataset.thumb || '';

      const nameEl = card.querySelector('.oc-name');
      // textContent だとルビ(rt)の読み仮名まで拾ってしまうので、
      // クローンしてルビ部分だけ取り除いてから名前を取得する
      let name = '';
      if (nameEl) {
        const clone = nameEl.cloneNode(true);
        clone.querySelectorAll('rt').forEach(rt => rt.remove());
        name = clone.textContent.trim();
      }

      const a = document.createElement('a');
      a.href = '#' + card.id;
      a.className = 'cast-item';
      a.dataset.world = card.dataset.world;
      a.dataset.card = card.id;
      a.style.display = card.dataset.world === 'world-a' ? 'flex' : 'none';

      const thumb = document.createElement('span');
      thumb.className = 'cast-thumb' + (thumbSrc ? '' : ' placeholder');
      if (thumbSrc) thumb.style.backgroundImage = `url('${thumbSrc}')`;

      const label = document.createElement('span');
      label.className = 'cast-name';
      label.textContent = name;

      a.appendChild(thumb);
      a.appendChild(label);
      a.addEventListener('click', function (e) {
        e.preventDefault();
        if (a.classList.contains('cast-dim')) return; // 所属フィルターで外れているキャラ
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + card.id); // このキャラへのリンクとして共有できるように
      });

      indexEl.appendChild(a);
    });
  })();

  // 立ち絵タップで「変化/通常」を切り替え、衣装違いは別のボタンで選ぶ
  document.querySelectorAll('.oc-portrait').forEach((el, portraitIndex) => {
    let forms = {};
    try { forms = JSON.parse(el.dataset.forms || '{}'); } catch (err) { forms = {}; }
    const formKeys = Object.keys(forms);
    if (formKeys.length === 0) return;

    const wrap = el.closest('.oc-portrait-wrap');
    const badge = wrap.querySelector('.portrait-badge');
    const costumeSelect = wrap.querySelector('.costume-select');
    // 画像の代替テキスト用に、キャラ名(ルビは除く)を取っておく
    const nameEl = el.closest('.oc-card').querySelector('.oc-name');
    let charName = '';
    if (nameEl) {
      const nameClone = nameEl.cloneNode(true);
      nameClone.querySelectorAll('rt').forEach(rt => rt.remove());
      charName = nameClone.textContent.trim();
    }

    let formIdx = 0;
    let costumeIdx = 0;

    function currentForm() {
      return forms[formKeys[formIdx]];
    }

    function currentCostumes() {
      const c = currentForm().costumes;
      return (c && c.length > 0) ? c : [{ src: '', label: '' }];
    }

    // 姿(通常/変化)によって衣装ボタンの数が違うと、切り替えるたびに
    // カードの高さがガクッと変わって見える(いわゆる「パカパカ」)ので、
    // そのキャラの中で一番衣装が多い姿に合わせて、あらかじめスペースを確保しておく。
    // 以前はDOMに仮のボタンを追加して実測していましたが、この「追加→測定→削除」が
    // ページ読み込み中に何度も強制的なレイアウト計算(forced reflow)を発生させ、
    // 表示が遅くなる原因になっていたため、概算の計算だけで済ませる方式に変更しました
    function reserveCostumeHeight() {
      let maxCount = 0;
      formKeys.forEach(key => {
        const n = (forms[key].costumes || []).length;
        if (n > maxCount) maxCount = n;
      });
      if (maxCount > 1) {
        const perRow = 3; // 1行あたりだいたい3個入る想定の概算
        const rowHeight = 33; // ボタンの高さ(約28px)+行間(約5px)の概算
        const rows = Math.ceil(maxCount / perRow);
        costumeSelect.style.minHeight = (rows * rowHeight) + 'px';
      }
    }
    reserveCostumeHeight();

    function renderCostumeButtons() {
      const costumes = currentCostumes();
      costumeSelect.innerHTML = '';
      costumeSelect.style.display = 'flex'; // 常に表示し、中身の有無だけで高さの差を吸収する
      // 1着しか無い姿でもボタンを1個だけ出す(空欄のままだと、複数衣装がある姿と
      // 比べて下の余白の見え方が変わり、キャラがより浮いて見えてしまうため)
      costumes.forEach((c, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = c.label;
        if (i === costumeIdx) b.classList.add('active');
        b.setAttribute('aria-pressed', i === costumeIdx ? 'true' : 'false');
        if (costumes.length > 1) {
          b.addEventListener('click', function (ev) {
            ev.stopPropagation(); // 立ち絵タップ(姿の切り替え)と混ざらないように
            costumeIdx = i;
            render();
          });
        } else {
          b.disabled = true; // 切り替え先が無いので押せなくする
        }
        costumeSelect.appendChild(b);
      });
    }

    function render() {
      const form = currentForm();
      const costumes = currentCostumes();
      const c = costumes[costumeIdx] || costumes[0];

      let img = el.querySelector('img');
      if (c.src) {
        if (!img) {
          img = document.createElement('img');
          img.alt = '';
          if (portraitIndex === 0) {
            // 一番最初のキャラ(このページで最初に表示される=LCP画像になりやすい)は
            // 遅延読み込みにしない。むしろ優先的に読み込んだ方が表示が速くなる
            img.loading = 'eager';
            img.fetchPriority = 'high';
          } else {
            img.loading = 'lazy';
          }
          el.appendChild(img);
        }
        img.src = c.src;
        // 画像ごとの余白(キャラがキャンバス内で占める大きさ)がバラバラで
        // 統一しづらい場合、costume に "scale": 1.3 のような値を入れると
        // その画像だけ拡大表示して、他の姿とサイズ感を揃えられます(省略時は1)
        img.style.transform = c.scale && c.scale !== 1 ? `scale(${c.scale})` : '';
        el.classList.remove('placeholder');
      } else {
        if (img) img.remove();
        el.classList.add('placeholder');
      }

      let label = form.label;
      if (costumes.length > 1) label += '・' + c.label;
      if (!c.src) label += '(準備中)';
      badge.textContent = label;
      if (img && c.src) img.alt = charName + '(' + label + ')';

      renderCostumeButtons();
    }

    render();

    if (formKeys.length > 1) {
      const poof = wrap.querySelector('.poof');

      function switchForm() {
        if (poof) {
          poof.classList.remove('active');
          void poof.offsetWidth; // アニメーション再トリガー用
          poof.classList.add('active');
          setTimeout(() => poof.classList.remove('active'), 650);
        }
        // 煙が中央に寄って画面を覆うタイミングで裏の画像を差し替える
        setTimeout(() => {
          formIdx = (formIdx + 1) % formKeys.length;
          costumeIdx = 0; // 姿を切り替えたら衣装選択もリセット
          render();
        }, 300);
      }

      // キーボード・スクリーンリーダーからも姿を切り替えられるようにする
      el.setAttribute('role', 'button');
      el.tabIndex = 0;
      el.setAttribute('aria-label', charName + ': タップで' + formKeys.map(k => forms[k].label).join('/') + 'を切り替え');
      el.addEventListener('click', switchForm);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          switchForm();
        }
      });
    } else {
      el.classList.add('single');
    }
  });

  // ボイスサンプル再生(複数ボタン対応・排他再生)
  let currentVoiceAudio = null;
  document.querySelectorAll('.voice-play').forEach(btn => {
    const src = btn.dataset.src;
    const icon = btn.querySelector('.material-symbols-outlined');

    if (!src) {
      btn.disabled = true; // 音源未設定の間はボタンを無効化
      return;
    }

    const audio = new Audio(src);
    audio.preload = 'none';

    btn.addEventListener('click', () => {
      if (audio.paused) {
        // 他のボタンが再生中なら止める(同時に何個も鳴らないように)
        if (currentVoiceAudio && currentVoiceAudio !== audio) {
          currentVoiceAudio.pause();
          currentVoiceAudio.currentTime = 0;
        }
        currentVoiceAudio = audio;
        audio.play();
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('play', () => {
      btn.classList.add('playing');
      icon.textContent = 'pause';
    });
    audio.addEventListener('pause', () => {
      btn.classList.remove('playing');
      icon.textContent = 'play_arrow';
    });
    audio.addEventListener('ended', () => {
      btn.classList.remove('playing');
      icon.textContent = 'play_arrow';
    });
  });

  // 真名タップで開示(キーボードでも操作可)
  document.querySelectorAll('.true-name').forEach(el => {
    el.setAttribute('role', 'button');
    el.tabIndex = 0;
    el.setAttribute('aria-pressed', 'false');

    function toggleName() {
      el.classList.toggle('revealed');
      const revealed = el.classList.contains('revealed');
      el.setAttribute('aria-pressed', revealed ? 'true' : 'false');
      el.querySelector('.material-symbols-outlined').textContent = revealed ? 'visibility_off' : 'visibility';
    }

    el.addEventListener('click', toggleName);
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleName();
      }
    });
  });

  // 世界観フィルター(単一選択・共存しない)+ 所属フィルター(とどのつまり限定・複数選択可)
  //
  // 「どのカードを見せるか」は、状態(currentWorld / activeAffils)から毎回まるごと計算する。
  // (以前は世界観の切り替えと所属の絞り込みがそれぞれカードの表示を書き換えていたため、
  //  所属で絞ったまま世界観を切り替えると、隠れていたはずのカードが別の世界観で復活していた)
  const worldFilters = document.getElementById('worldFilters');
  const affilFilters = document.getElementById('affilFilters');
  const activeAffils = new Set();
  let currentWorld = null;

  function shouldShow(card) {
    if (card.dataset.world !== currentWorld) return false;
    if (currentWorld !== 'world-a') return true; // 所属フィルターは「とどのつまり」限定
    return activeAffils.size === 0 || activeAffils.has(card.dataset.affiliation);
  }

  function hideNow(card) {
    card.style.display = 'none';
    card.classList.remove('affil-leaving', 'affil-entering');
    card.classList.add('affil-hidden');
  }

  // animate=true: 同じ世界観の中での絞り込み(フェード付き) / false: 世界観の切り替え(即時)
  function setCardVisible(card, visible, animate) {
    const isShown = card.style.display !== 'none';

    if (visible) {
      clearTimeout(card._hideTimer); // 隠す予約が残っていたら取り消す
      card.classList.remove('affil-leaving');
      if (!isShown) {
        card.style.display = 'block';
        card.classList.remove('affil-hidden', 'affil-entering');
        if (animate) {
          card.classList.add('affil-entering');
          requestAnimationFrame(() => {
            requestAnimationFrame(() => card.classList.remove('affil-entering'));
          });
        }
      }
      return;
    }

    if (!isShown) return; // もう隠れている
    if (animate) {
      if (card.classList.contains('affil-leaving')) return; // フェードアウト中
      card.classList.add('affil-leaving');
      card._hideTimer = setTimeout(() => hideNow(card), 200);
    } else {
      clearTimeout(card._hideTimer);
      hideNow(card);
    }
  }

  function refreshCards(animate) {
    document.querySelectorAll('.oc-card').forEach(card => {
      setCardVisible(card, shouldShow(card), animate);
    });
  }

  // ボタンの見た目(.active)と、スクリーンリーダー向けの状態(aria-pressed)を揃える
  function syncPressed(container) {
    container.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', b.classList.contains('active') ? 'true' : 'false');
    });
  }

  // キャスト一覧: 今の世界観のキャラだけ表示。所属フィルターで外れているキャラは薄くしてタップ不可にする
  function refreshCastIndex() {
    document.querySelectorAll('.cast-item').forEach(el => {
      const inWorld = el.dataset.world === currentWorld;
      el.style.display = inWorld ? 'flex' : 'none';
      const card = document.getElementById(el.dataset.card);
      const dim = inWorld && card && !shouldShow(card);
      el.classList.toggle('cast-dim', !!dim);
      if (dim) el.setAttribute('tabindex', '-1'); else el.removeAttribute('tabindex');
    });
  }

  function clearAffils() {
    activeAffils.clear();
    affilFilters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    syncPressed(affilFilters);
    refreshCards(false);
    refreshCastIndex();
  }

  affilFilters.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    const a = btn.dataset.affil;
    if (activeAffils.has(a)) {
      activeAffils.delete(a);
      btn.classList.remove('active');
    } else {
      activeAffils.add(a);
      btn.classList.add('active');
    }
    syncPressed(affilFilters);
    refreshCards(true);
    refreshCastIndex();

    // スクロール位置によっては絞り込み結果が画面外になり、何が変わったか
    // わからなくなることがあるので、キャスト一覧の先頭が見える位置に寄せる
    const castIndexEl = document.getElementById('castIndex');
    if (castIndexEl) {
      castIndexEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  function applyWorldFilter(world) {
    currentWorld = world;

    // 所属フィルターは世界観を切り替えるたびにリセットする
    activeAffils.clear();
    affilFilters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    syncPressed(affilFilters);
    affilFilters.style.display = world === 'world-a' ? 'flex' : 'none';

    refreshCastIndex();
    refreshCards(false);
  }

  // 世界観ボタンを選んで切り替える(クリックとディープリンクの両方から使う)
  function selectWorld(world) {
    worldFilters.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.world === world));
    syncPressed(worldFilters);
    applyWorldFilter(world);
    if (window.updateMascot) window.updateMascot(); // マスコットもキャラ連動なので、世界観切り替え時に選び直す
  }

  worldFilters.addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    selectWorld(btn.dataset.world);
  });

  // ▼ディープリンク▼ oc.html#キャラID で、そのキャラの世界観を開いて位置まで移動する
  // (キャスト一覧をタップしたときも URL の # が更新されるので、そのURLをそのまま共有できます)
  function openFromHash(smooth) {
    let id = '';
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (err) { return false; }
    const card = id ? document.getElementById(id) : null;
    if (!card || !card.classList.contains('oc-card')) return false;

    if (card.dataset.world !== currentWorld) selectWorld(card.dataset.world);
    else if (!shouldShow(card)) clearAffils(); // 所属フィルターで隠れていたら解除する

    card.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
    return true;
  }

  window.addEventListener('hashchange', () => openFromHash(true));

  // ページ読み込み時にも、今アクティブなボタンの世界観で一度絞り込んでおく
  // (これが無いと、リロード直後は誰もフィルターされず全員表示されてしまう)
  const initialWorldBtn = worldFilters.querySelector('button.active') || worldFilters.querySelector('button');
  if (initialWorldBtn) {
    applyWorldFilter(initialWorldBtn.dataset.world);
    syncPressed(worldFilters);
  }

  if (location.hash && openFromHash(false)) {
    // フォントの読み込みで文字の高さが変わると位置がずれるので、
    // まだ自分でスクロールしていなければ、読み込み後にもう一度合わせる
    let userScrolled = false;
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(t => {
      window.addEventListener(t, () => { userScrolled = true; }, { once: true, passive: true });
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { if (!userScrolled) openFromHash(false); });
    }
  }

  // 各カード下の「↑ 一覧へ」
  const ocListEl = document.getElementById('ocList');
  if (ocListEl) {
    ocListEl.addEventListener('click', function (e) {
      const btn = e.target.closest('.oc-foot-btn');
      if (!btn) return;
      e.preventDefault();
      const top = document.getElementById('worldFilters');
      if (top) top.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', location.pathname + location.search); // カードの # を外す
    });
  }

  // SDイラストは oc-data.js の各キャラの sd に登録します(複数書くとランダムに出ます)。
  // 描画時に各カードの data-sd に入るので、ここでは表示中のカードのものだけを拾います。

  // mascot.js に「いま表示中のキャラのSDだけ」を渡す
  window.mascotGetPool = function () {
    return Array.from(document.querySelectorAll('.oc-card'))
      .filter(card => card.style.display !== 'none' && card.dataset.sd)
      .flatMap(card => card.dataset.sd.split(',').map(s => s.trim()).filter(Boolean));
  };
</script>

<script src="mascot.js"></script>

</body>
</html>
